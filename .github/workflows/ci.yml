name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_bot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support_bot"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://support:support@localhost:5432/support_bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q