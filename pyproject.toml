[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-support-bot"
version = "1.0.0"
description = "Claude-powered order support agent: verification, deterministic policy, idempotent actions, MCP, FastAPI, Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4,<3",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "fastapi[standard]>=0.135",
    "mcp>=2,<3",
    "langfuse>=5,<6",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=22.8,<23", "httpx>=0.27"]
dev = ["pytest", "ruff"]

[project.scripts]
support-bot = "support_bot.cli:main"
support-bot-init = "support_bot.cli:init"
support-bot-mcp = "support_bot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_bot = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
